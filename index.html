<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金融商分情报 · Fintech Overflow v2</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --sidebar-bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-hover: #F8FAFC;
      --ink: #0F172A;
      --ink-2: #334155;
      --muted: #64748B;
      --border: #E2E8F0;
      --border-soft: #F1F5F9;
      --accent: #0F172A;
      --p0-bg: #FEF2F2; --p0-fg: #B91C1C;
      --blue-bg: #EFF6FF; --blue-fg: #1D4ED8;
      --green-bg: #ECFDF5; --green-fg: #047857;
      --red-bg: #FEF2F2; --red-fg: #B91C1C;
      --amber-bg: #FFFBEB; --amber-fg: #B45309;
      --purple-bg: #F5F3FF; --purple-fg: #6D28D9;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    html.dark {
      --bg: #0A0E17;
      --sidebar-bg: #0E1420;
      --surface: #111827;
      --surface-hover: #172033;
      --ink: #F8FAFC;
      --ink-2: #CBD5E1;
      --muted: #94A3B8;
      --border: #1E293B;
      --border-soft: #151E2E;
      --accent: #F8FAFC;
      --p0-bg: rgba(239,68,68,0.18); --p0-fg: #FCA5A5;
      --blue-bg: rgba(59,130,246,0.16); --blue-fg: #93C5FD;
      --green-bg: rgba(16,185,129,0.16); --green-fg: #6EE7B7;
      --red-bg: rgba(239,68,68,0.16); --red-fg: #FCA5A5;
      --amber-bg: rgba(245,158,11,0.16); --amber-fg: #FCD34D;
      --purple-bg: rgba(139,92,246,0.16); --purple-fg: #C4B5FD;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 13.5px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .layout { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 244px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .brand { padding: 2px 6px; }
    .brand-row { display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 8px; height: 8px; border-radius: 2px; background: #B91C1C; }
    .brand-name { font-size: 14.5px; font-weight: 800; letter-spacing: -0.01em; }
    .brand-tag { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .sb-select {
      width: 100%;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }
    .nav-group-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding: 0 8px 5px;
    }
    .nav-list { display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      appearance: none;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12.8px;
      font-weight: 500;
      color: var(--ink-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.12s, color 0.12s;
    }
    .nav-item:hover { background: var(--surface-hover); color: var(--ink); }
    .nav-item.active {
      background: var(--surface);
      color: var(--ink);
      font-weight: 700;
      border-color: var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .nav-cnt { font-family: var(--mono); font-size: 11px; color: var(--muted); }

    .sb-meta {
      margin-top: auto;
      padding: 12px 6px 2px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sb-btn {
      width: 100%;
      padding: 6px 8px;
      font-size: 11.5px;
      font-weight: 600;
      background: var(--surface);
      color: var(--ink-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    .sb-btn:hover { color: var(--ink); border-color: var(--muted); }

    /* Main */
    .main {
      flex: 1;
      min-width: 0;
      padding: 22px 34px 64px;
      max-width: 1040px;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .page-title { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
    .page-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .search-box {
      width: 260px;
      max-width: 100%;
      padding: 6.5px 11px;
      font-size: 12.5px;
      background: var(--sidebar-bg);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
    }
    .search-box:focus { border-color: var(--muted); background: var(--surface); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
      align-items: center;
    }
    .pill {
      appearance: none;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3.5px 10px;
      font-size: 11.8px;
      color: var(--ink-2);
      cursor: pointer;
      transition: all 0.12s;
    }
    .pill:hover { border-color: var(--muted); color: var(--ink); }
    .pill.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }
    .pill.p0-pill.active {
      background: #B91C1C;
      border-color: #B91C1C;
      color: #FFF;
    }

    /* Sticky Date Group Header */
    .date-divider {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding: 8px 4px 6px;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* High-Density Feed Row */
    .feed-row {
      border-bottom: 1px solid var(--border-soft);
      padding: 11px 8px;
      transition: background 0.1s;
      cursor: pointer;
      border-left: 2.5px solid transparent;
    }
    .feed-row:hover { background: var(--surface-hover); }
    .feed-row.selected { border-left-color: #B91C1C; background: var(--surface-hover); }
    .feed-head { display: flex; align-items: flex-start; gap: 10px; }
    .co-badge {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 800;
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .feed-body { flex: 1; min-width: 0; }
    .feed-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .feed-title { font-size: 13.8px; font-weight: 600; color: var(--ink); line-height: 1.44; }
    .p0-dot {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 800;
      padding: 0 5px;
      border-radius: 3px;
      background: var(--p0-bg);
      color: var(--p0-fg);
      margin-right: 6px;
      vertical-align: 1px;
    }
    .feed-date { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
    .chip-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 5px; }
    .chip {
      font-size: 10.8px;
      font-weight: 600;
      padding: 1px 6.5px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
    }
    .chip-meta { background: var(--sidebar-bg); color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
    .chip-co-link { background: var(--sidebar-bg); color: var(--ink); border: 1px solid var(--border); cursor: pointer; }
    .chip-co-link:hover { border-color: var(--ink); }
    .chip-achieved { background: var(--green-bg); color: var(--green-fg); }
    .chip-promised { background: var(--blue-bg); color: var(--blue-fg); }
    .chip-risk { background: var(--red-bg); color: var(--red-fg); }
    .chip-reg { background: var(--red-bg); color: var(--red-fg); }
    .chip-shift { background: var(--purple-bg); color: var(--purple-fg); }
    .chip-funding { background: var(--amber-bg); color: var(--amber-fg); }
    .chip-partner { background: var(--blue-bg); color: var(--blue-fg); }

    .feed-detail {
      display: none;
      margin-top: 10px;
      padding: 12px 14px;
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 12.8px;
      color: var(--ink-2);
      cursor: default;
    }
    .feed-row.open .feed-detail { display: block; }
    .metrics-box {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .m-k { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; }
    .m-v { font-size: 12.2px; color: var(--ink); font-weight: 600; }
    .detail-insight {
      margin-top: 8px;
      padding-left: 10px;
      border-left: 2.5px solid #B91C1C;
      color: var(--ink);
      font-size: 12.6px;
    }
    .detail-foot {
      margin-top: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.8px;
    }
    .ext-link { color: var(--blue-fg); font-weight: 600; }
    .ext-link:hover { text-decoration: underline; }

    /* Data Tables (Partner Matrix & Funding M&A) */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.3px;
    }
    th {
      text-align: left;
      padding: 10px 12px;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-soft);
      color: var(--ink-2);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-hover); }

    /* Bet Map & Companies */
    .bet-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 14px;
      background: var(--surface);
    }
    .bet-title { font-size: 14.5px; font-weight: 700; margin-bottom: 5px; }
    .bet-desc { font-size: 12.3px; color: var(--muted); margin-bottom: 12px; }
    .bet-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .bet-col { background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; }
    .bet-col-head { font-size: 11.8px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
    .bet-player { font-size: 12px; color: var(--ink-2); padding: 3px 0; border-top: 1px dashed var(--border); }
    .bet-player:first-of-type { border-top: none; }

    .co-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .co-card {
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 12px;
      background: var(--surface);
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .co-card:hover { border-color: var(--muted); background: var(--surface-hover); }
    .co-card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .co-card-name { font-weight: 700; font-size: 12.8px; color: var(--ink); }
    .co-card-sub { font-size: 11.2px; color: var(--muted); margin-top: 3px; }

    /* Company Profile Slide-Over Drawer */
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 23, 42, 0.45);
      justify-content: flex-end;
    }
    .drawer-backdrop.open { display: flex; }
    .drawer {
      width: 460px;
      max-width: 92vw;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 22px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .drawer-close {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 28px;
      height: 28px;
      font-size: 16px;
      color: var(--muted);
      cursor: pointer;
    }
    .drawer-close:hover { color: var(--ink); border-color: var(--ink); }
    .drawer-kv { display: grid; grid-template-columns: 1fr; gap: 8px; background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 12.5px; }
    .drawer-sec-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }

    .kbd-hint { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
    .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13px; }

    @media (max-width: 860px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); }
      .main { padding: 16px 14px 48px; }
      .metrics-box, .bet-cols, .co-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    <main class="main">
      <div class="topbar">
        <div>

      </div>

      <div id="filterBar" class="filters"></div>
      <div id="viewRoot"></div>

  </div>

  <!-- Company Profile Slide-Over Drawer -->
  <div id="drawerBackdrop" class="drawer-backdrop" role="dialog" aria-modal="true">
    <div id="drawerContent" class="drawer"></div>
  </div>

    function syncCounts() {
      document.getElementById("cntAll").textContent = DB.events.length;
      document.getElementById("cntL1").textContent = DB.events.filter(x => x.layer === "layer1").length;
      document.getElementById("cntL2").textContent = DB.events.filter(x => x.layer === "layer2").length;

      document.getElementById("metaStamp").innerHTML = `Last update: <b>${esc(DB.meta.lastUpdate)}</b><br>Next: ${esc(DB.meta.nextUpdate)}`;

      const sel = document.getElementById("companyFilter");
      const names = Array.from(new Set([...DB.events.map(f => f.company), ...DB.companies.map(c => c.name)]));
      sel.innerHTML = `<option value="all">全部公司（All ${DB.companies.length} companies）</option>` +
        names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
    }

    function matchCompany(item) {
      if (state.company === "all") return true;
      const target = state.company.toLowerCase();
      const head = target.split(/[\s\/（(]/)[0];
      if ((item.company || "").toLowerCase().includes(head) || target.includes((item.company || "").toLowerCase())) return true;
      if (Array.isArray(item.related) && item.related.some(r => r.toLowerCase().includes(head))) return true;
      return `${item.headline || item.title || ""} ${item.summary || ""}`.toLowerCase().includes(head);
    }

    function matchQuery(text) {
      if (!state.q.trim()) return true;
      return text.toLowerCase().includes(state.q.trim().toLowerCase());
    }

    function getVisibleEvents(layerFilter) {
      return DB.events.filter(ev => {
        if (layerFilter && ev.layer !== layerFilter) return false;
        if (state.onlyP0 && ev.priority !== "P0") return false;
        if (state.region !== "all" && ev.region !== state.region) return false;
        if (state.vertical !== "all" && ev.vertical !== state.vertical) return false;
        if (!matchCompany(ev)) return false;
        return matchQuery(`${ev.company} ${ev.headline} ${ev.summary} ${ev.insight} ${ev.verticalLabel}`);
      });
    }

    function renderFeedView(layerFilter) {
      const items = getVisibleEvents(layerFilter);
      const fbar = document.getElementById("filterBar");
      const regions = [{ id: "all", label: "全部区域" }, { id: "cn", label: "中国国内含港" }, { id: "eu", label: "欧洲 / 跨国" }];
      const verts = [{ id: "all", label: "全部板块" }, { id: "ecommerce", label: "电商" }, { id: "payment", label: "支付 / RWA" }, { id: "bnpl", label: "消金 / BNPL" }, { id: "wealth", label: "财富 / 货币" }];
      fbar.innerHTML =
        `<button type="button" data-p0="1" class="pill p0-pill ${state.onlyP0 ? "active" : ""}">只看 P0 重大事件</button>` +
        `<span style="width:1px;height:14px;background:var(--border);margin:0 3px;"></span>` +
        regions.map(r => `<button type="button" data-region="${r.id}" class="pill ${state.region===r.id?"active":""}">${r.label}</button>`).join("") +
        `<span style="width:1px;height:14px;background:var(--border);margin:0 3px;"></span>` +
        verts.map(v => `<button type="button" data-vertical="${v.id}" class="pill ${state.vertical===v.id?"active":""}">${v.label}</button>`).join("");

      const root = document.getElementById("viewRoot");
      if (!items.length) {
        root.innerHTML = `<div class="empty">当前筛选条件下暂无动态，可关闭「只看 P0」或切回「全部公司」。</div>`;
        return;
      }

      // Group by date with sticky headers
      const groups = [];
      items.forEach((ev, idx) => {
        const last = groups[groups.length - 1];
        if (!last || last.date !== ev.date) groups.push({ date: ev.date, rows: [{ ev, idx }] });
        else last.rows.push({ ev, idx });
      });

      root.innerHTML = groups.map(g => `
        <div class="date-divider"><span>${esc(g.date)}</span><span>${g.rows.length} 条动态</span></div>
        ${g.rows.map(({ ev, idx }) => {
          const isOpen = state.openIds.has(ev.id);
          const isSel = idx === state.selectedIdx;
          return `
            <div class="feed-row ${isOpen ? "open" : ""} ${isSel ? "selected" : ""}" data-ev="${ev.id}" data-idx="${idx}">
              <div class="feed-head">
                <span class="co-badge">${esc(ev.code)}</span>
                <div class="feed-body">
                  <div class="feed-line">
                    <div class="feed-title">${ev.priority === "P0" ? `<span class="p0-dot">P0</span>` : ""}${esc(ev.headline)}</div>
                    <span class="feed-date">${esc(ev.shortDate)}</span>
                  </div>
                  <div class="chip-row">
                    <span class="chip chip-co-link" data-open-drawer="${esc(ev.company)}" title="查看公司档案">${esc(ev.company)}</span>
                    <span class="chip chip-meta">${esc(ev.layerLabel)} · ${esc(ev.regionLabel)}</span>
                    ${(ev.chips || []).map(c => `<span class="chip chip-${esc(c.type)}">${esc(c.text)}</span>`).join("")}
                  </div>
                  <div class="feed-detail" onclick="event.stopPropagation()">
                    ${ev.metrics ? `<div class="metrics-box">${ev.metrics.map(m => `<div><span class="m-k">${esc(m.k)}</span><span class="m-v">${esc(m.v)}</span></div>`).join("")}</div>` : ""}
                    <div>${esc(ev.summary)}</div>
                    <div class="detail-insight"><b>商分 / 监管解读：</b>${esc(ev.insight)}</div>
                    <div class="detail-foot">
                      <span style="color:var(--muted);">信源 · ${esc(ev.sourceTitle)}</span>
                      <a class="ext-link" href="${esc(ev.url)}" target="_blank" rel="noopener noreferrer">查看一手原文 ↗</a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join("")}
      `).join("");
    }

        { id: "eu_psp", label: "PSP 与本地支付 (17)" }
      ];
      document.getElementById("filterBar").innerHTML = groups.map(g =>
        `<button type="button" data-cogroup="${g.id}" class="pill ${state.coGroup===g.id?"active":""}">${g.label}</button>`
      ).join("");

      const list = DB.companies.filter(c => {
        if (state.coGroup !== "all" && c.group !== state.coGroup) return false;
        return matchQuery(`${c.name} ${c.groupLabel} ${c.sub} ${c.profile?.model || ""}`);
      });

      document.getElementById("viewRoot").innerHTML = list.length ? `
        <div class="co-grid">
          ${list.map(c => {
            const head = c.name.split(/[\s\/（(]/)[0].toLowerCase();
            const cnt = DB.events.filter(f => f.company.toLowerCase().includes(head) || (f.related||[]).some(r => r.toLowerCase().includes(head))).length;
            return `
              <div class="co-card" data-open-drawer="${esc(c.name)}">
                <div class="co-card-top">
                  <span class="co-card-name">${esc(c.name)}</span>
                  ${cnt ? `<span class="chip chip-promised">${cnt} 条动态</span>` : (c.profile ? `<span class="chip chip-achieved">已建档</span>` : `<span class="feed-date">盯盘中</span>`)}
                </div>
                <div class="co-card-sub">${esc(c.groupLabel)} · ${esc(c.sub)}</div>
              </div>
            `;
          }).join("")}
        </div>
      ` : `<div class="empty">没有匹配的竞对公司</div>`;
    }

    function openCompanyDrawer(name) {
      const head = name.split(/[\s\/（(]/)[0].toLowerCase();
      const co = DB.companies.find(c => c.name === name || c.name.toLowerCase().includes(head)) || { name, groupLabel: "重点追踪主体", sub: "金融 / 监管机构" };
      const relEvents = DB.events.filter(ev =>
        ev.company.toLowerCase().includes(head) ||
        name.toLowerCase().includes(ev.company.toLowerCase()) ||
        (ev.related || []).some(r => r.toLowerCase().includes(head))
      );
      const prof = co.profile;

      document.getElementById("drawerContent").innerHTML = `
        <div class="drawer-head">
          <div>
            <h2 style="font-size:18px;font-weight:800;">${esc(co.name)}</h2>
            <div style="font-size:12px;color:var(--muted);margin-top:2px;">${esc(co.groupLabel)} · ${esc(co.sub)}</div>
          </div>
          <button id="closeDrawerBtn" class="drawer-close" type="button">×</button>
        </div>

        ${prof ? `
          <div class="drawer-kv">
            <div><span class="m-k">总部 / 区域</span><span class="m-v">${esc(prof.hq)}</span></div>
            <div><span class="m-k">商业模式定位</span><span class="m-v">${esc(prof.model)}</span></div>
            <div><span class="m-k">最新核心锚点</span><span class="m-v">${esc(prof.metric)}</span></div>
            <div><span class="m-k">牌照与监管</span><span class="m-v">${esc(prof.license)}</span></div>
            <div><span class="m-k">核心合作伙伴</span><div class="chip-row" style="margin-top:4px;">${prof.partners.map(p => `<span class="chip chip-meta">${esc(p)}</span>`).join("")}</div></div>
          </div>
        ` : `<div class="drawer-kv"><div><span class="m-k">盯盘状态</span><span class="m-v">已纳入全量 76 家竞对每日 24H 自动扫描，有新发财报/融资/监管动态时自动沉淀至下方时间线。</span></div></div>`}

        <div>
          <div class="drawer-sec-title">已收录动态时间线（${relEvents.length} 条）</div>
          ${relEvents.length ? relEvents.map(ev => `
            <div style="padding:10px 0;border-bottom:1px solid var(--border-soft);">
              <div style="display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-bottom:3px;">
                <span>${esc(ev.layerLabel)} · ${esc(ev.priority)}</span>
                <span style="font-family:var(--mono);">${esc(ev.date)}</span>
              </div>
              <div style="font-weight:600;font-size:13px;color:var(--ink);margin-bottom:4px;">${esc(ev.headline)}</div>
              <div style="font-size:12px;color:var(--ink-2);margin-bottom:5px;">${esc(ev.insight)}</div>
              <a class="ext-link" style="font-size:11.5px;" href="${esc(ev.url)}" target="_blank" rel="noopener noreferrer">查看原文 ↗</a>
            </div>
          `).join("") : `<div style="font-size:12.5px;color:var(--muted);padding:12px 0;">近几日暂无新发重磅动态。</div>`}
        </div>
      `;
      document.getElementById("drawerBackdrop").classList.add("open");
    }

    const VIEW_META = {
      feed: ["全部动态 Feed", "增量累积数据库（已去噪并按日期吸顶分组）· 支持 J/K 切换与 Enter 展开"],
      layer1: ["一层 · 财报与业绩会", "76 家竞对最新财报核心指标与业绩会管理层表态"],
      layer2: ["二层 · 行业动态", "欧洲与中国国内（含香港）五大板块经营、并购、产品与合作动作"],
      layer3: ["三层 · 监管动态", "近 24h 政策执法 + 国内消费信贷“930新规”与英国/欧盟重点主线"],
      matrix: ["合作矩阵 Partner Matrix", "欧洲核心电商平台 × BNPL 与 PSP 通道接入格局一览"],
      funding: ["融资与并购账本 Funding & M&A", "集中追踪 2026 重点竞对估值、融资、并购与私有化交易"],
      milestones: ["承诺与节点 Milestones", "追踪管理层与监管机构已兑现（Achieved）、推进中（Promised）与承压（At Risk）节点"],
      bets: ["战略押注 Bet Map", "金融科技与跨境电商 4 大核心路线分歧与竞对站队矩阵"],
      companies: ["全量竞对名录（76 家）", "点击任意公司从右侧滑出完整公司档案与历史动态时间线"]
    };

    function render() {
      document.querySelectorAll(".nav-item").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-view") === state.view);
      });
      const meta = VIEW_META[state.view] || VIEW_META.feed;
      document.getElementById("viewTitle").textContent = state.company === "all" ? meta[0] : `${meta[0]} · ${state.company}`;
      document.getElementById("viewSub").textContent = meta[1];

      if (state.view === "feed") renderFeedView(null);
      else if (state.view === "layer1") renderFeedView("layer1");
      else if (state.view === "layer2") renderFeedView("layer2");
      else if (state.view === "layer3") renderFeedView("layer3");
      else if (state.view === "matrix") renderPartnerMatrix();
      else if (state.view === "funding") renderFunding();
      else if (state.view === "milestones") renderMilestones();
      else if (state.view === "bets") renderBetMap();
      else renderCompanies();
    }

    // Bindings
    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.addEventListener("click", () => {
        state.view = btn.getAttribute("data-view");
        state.selectedIdx = 0;
        render();
      });
    });

    document.getElementById("companyFilter").addEventListener("change", (e) => {
      state.company = e.target.value;
      state.selectedIdx = 0;
      if (state.view === "companies" && state.company !== "all") state.view = "feed";
      render();
    });

    document.getElementById("searchBox").addEventListener("input", (e) => {
      state.q = e.target.value;
      state.selectedIdx = 0;
      render();
    });

    document.getElementById("filterBar").addEventListener("click", (e) => {
      if (e.target.closest("button[data-p0]")) { state.onlyP0 = !state.onlyP0; state.selectedIdx = 0; render(); return; }
      const rb = e.target.closest("button[data-region]");
      if (rb) { state.region = rb.getAttribute("data-region"); state.selectedIdx = 0; render(); return; }
      const vb = e.target.closest("button[data-vertical]");
      if (vb) { state.vertical = vb.getAttribute("data-vertical"); state.selectedIdx = 0; render(); return; }
      const cg = e.target.closest("button[data-cogroup]");
      if (cg) { state.coGroup = cg.getAttribute("data-cogroup"); render(); return; }
    });

    document.getElementById("viewRoot").addEventListener("click", (e) => {
      const coTrigger = e.target.closest("[data-open-drawer]");
      if (coTrigger) {
        e.stopPropagation();
        openCompanyDrawer(coTrigger.getAttribute("data-open-drawer"));
        return;
      }
      const row = e.target.closest(".feed-row");
      if (row) {
        const id = row.getAttribute("data-ev");
        state.selectedIdx = Number(row.getAttribute("data-idx") || 0);
        if (state.openIds.has(id)) state.openIds.delete(id);
        else state.openIds.add(id);
        render();
      }
    });

    document.getElementById("drawerBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "drawerBackdrop" || e.target.closest("#closeDrawerBtn")) {
        document.getElementById("drawerBackdrop").classList.remove("open");
      }
    });

    document.getElementById("themeToggle").addEventListener("click", () => {
      const isDark = document.documentElement.classList.toggle("dark");
      document.getElementById("themeToggle").textContent = isDark ? "浅色模式" : "深色模式";
      try { localStorage.setItem("fo_theme", isDark ? "dark" : "light"); } catch (e) {}
    });

    // Keyboard shortcuts: J / K / Enter / / / Esc
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        document.getElementById("drawerBackdrop").classList.remove("open");
        return;
      }
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "/") {
        e.preventDefault();
        document.getElementById("searchBox").focus();
        return;
      }
      if (!["feed", "layer1", "layer2", "layer3"].includes(state.view)) return;
      const rows = document.querySelectorAll(".feed-row");
      if (!rows.length) return;
      if (e.key === "j" || e.key === "J") {
        state.selectedIdx = Math.min(rows.length - 1, state.selectedIdx + 1);
        render();
        document.querySelector(`.feed-row[data-idx="${state.selectedIdx}"]`)?.scrollIntoView({ block: "nearest" });
      } else if (e.key === "k" || e.key === "K") {
        state.selectedIdx = Math.max(0, state.selectedIdx - 1);
        render();
        document.querySelector(`.feed-row[data-idx="${state.selectedIdx}"]`)?.scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        const selRow = document.querySelector(`.feed-row[data-idx="${state.selectedIdx}"]`);
        if (selRow) {
          const id = selRow.getAttribute("data-ev");
          if (state.openIds.has(id)) state.openIds.delete(id);
          else state.openIds.add(id);
          render();
        }
      }
    });

    try {
      if (localStorage.getItem("fo_theme") === "dark") {
        document.documentElement.classList.add("dark");
        document.getElementById("themeToggle").textContent = "浅色模式";
      }
    } catch (e) {}

    // Live-load ./data/intel_db.json when hosted on HTTP/HTTPS, otherwise use embedded fallback
    async function boot() {
      if (window.location.protocol === "http:" || window.location.protocol === "https:") {
        try {
          const r = await fetch("./data/intel_db.json?t=" + Date.now());
          if (r.ok) DB = await r.json();
        } catch (e) {}
      }
      syncCounts();
      render();
    }
    boot();
  </script>
</body>
</html>
