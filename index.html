<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金融商分情报 · Fintech Overflow</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --sidebar-bg: #F9FAFB;
      --surface: #FFFFFF;
      --surface-hover: #F8FAFC;
      --ink: #111827;
      --ink-2: #374151;
      --muted: #6B7280;
      --border: #E5E7EB;
      --border-soft: #F1F5F9;
      --accent: #111827;
      --blue-bg: #EFF6FF; --blue-fg: #1D4ED8;
      --green-bg: #ECFDF5; --green-fg: #047857;
      --red-bg: #FEF2F2; --red-fg: #B91C1C;
      --amber-bg: #FFFBEB; --amber-fg: #B45309;
      --purple-bg: #F5F3FF; --purple-fg: #6D28D9;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    html.dark {
      --bg: #0B0F17;
      --sidebar-bg: #0F141F;
      --surface: #111827;
      --surface-hover: #172033;
      --ink: #F3F4F6;
      --ink-2: #CBD5E1;
      --muted: #94A3B8;
      --border: #1F2937;
      --border-soft: #161E2E;
      --accent: #F9FAFB;
      --blue-bg: rgba(59,130,246,0.16); --blue-fg: #93C5FD;
      --green-bg: rgba(16,185,129,0.16); --green-fg: #6EE7B7;
      --red-bg: rgba(239,68,68,0.16); --red-fg: #FCA5A5;
      --amber-bg: rgba(245,158,11,0.16); --amber-fg: #FCD34D;
      --purple-bg: rgba(139,92,246,0.16); --purple-fg: #C4B5FD;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* Left Sidebar (Robot Overflow inspired) */
    .sidebar {
      width: 248px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .brand {
      padding: 2px 6px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 2px;
      background: #B91C1C;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .brand-tag {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .sb-select {
      width: 100%;
      padding: 7px 9px;
      font-size: 12.5px;
      font-weight: 500;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
      cursor: pointer;
    }
    .sb-select:focus { border-color: var(--muted); }

    .nav-group-title {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding: 0 8px 6px;
    }
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-item {
      appearance: none;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-radius: 7px;
      padding: 7px 9px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.12s, color 0.12s;
    }
    .nav-item:hover {
      background: var(--surface-hover);
      color: var(--ink);
    }
    .nav-item.active {
      background: var(--surface);
      color: var(--ink);
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      padding: 6px 8px;
    }
    .nav-cnt {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .sb-meta {
      margin-top: auto;
      padding: 12px 6px 2px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sb-controls {
      display: flex;
      gap: 6px;
    }
    .sb-btn {
      flex: 1;
      padding: 5px 8px;
      font-size: 11.5px;
      font-weight: 600;
      background: var(--surface);
      color: var(--ink-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    .sb-btn:hover { color: var(--ink); border-color: var(--muted); }

    /* Main Content */
    .main {
      flex: 1;
      min-width: 0;
      padding: 24px 36px 64px;
      max-width: 980px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .page-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .page-sub {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
    }
    .search-box {
      width: 250px;
      max-width: 100%;
      padding: 7px 12px;
      font-size: 12.5px;
      background: var(--sidebar-bg);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
    }
    .search-box:focus { border-color: var(--muted); background: var(--surface); }

    /* Filter Pills */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
      align-items: center;
    }
    .pill {
      appearance: none;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 12px;
      color: var(--ink-2);
      cursor: pointer;
      transition: all 0.12s;
    }
    .pill:hover { border-color: var(--muted); color: var(--ink); }
    .pill.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }

    /* High-Density Feed Rows (Signature Robot Overflow Pattern) */
    .feed-list {
      border-top: 1px solid var(--border);
    }
    .feed-row {
      border-bottom: 1px solid var(--border-soft);
      padding: 13px 8px;
      transition: background 0.12s;
      cursor: pointer;
    }
    .feed-row:hover {
      background: var(--surface-hover);
    }
    .feed-head {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }
    .co-badge {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 800;
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .feed-body {
      flex: 1;
      min-width: 0;
    }
    .feed-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .feed-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.45;
    }
    .feed-date {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }
    .chip {
      font-size: 11px;
      font-weight: 600;
      padding: 1.5px 7px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .chip-meta { background: var(--sidebar-bg); color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
    .chip-achieved { background: var(--green-bg); color: var(--green-fg); }
    .chip-promised { background: var(--blue-bg); color: var(--blue-fg); }
    .chip-risk { background: var(--red-bg); color: var(--red-fg); }
    .chip-reg { background: var(--red-bg); color: var(--red-fg); }
    .chip-shift { background: var(--purple-bg); color: var(--purple-fg); }
    .chip-funding { background: var(--amber-bg); color: var(--amber-fg); }
    .chip-partner { background: var(--blue-bg); color: var(--blue-fg); }

    /* Expandable Detail Drawer inside Feed Row */
    .feed-detail {
      display: none;
      margin-top: 11px;
      padding: 12px 14px;
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--ink-2);
      cursor: default;
    }
    .feed-row.open .feed-detail { display: block; }
    .metrics-box {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .m-k { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
    .m-v { font-size: 12.5px; color: var(--ink); font-weight: 600; }
    .detail-insight {
      margin-top: 8px;
      padding-left: 10px;
      border-left: 2.5px solid #B91C1C;
      color: var(--ink);
      font-size: 12.8px;
    }
    .detail-foot {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .ext-link {
      color: var(--blue-fg);
      font-weight: 600;
    }
    .ext-link:hover { text-decoration: underline; }

    /* Milestones Table */
    .ms-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 6px;
      border-bottom: 1px solid var(--border-soft);
    }
    .ms-left { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; flex: 1; }
    .ms-co { font-weight: 700; color: var(--ink); font-size: 13.5px; }
    .ms-title { color: var(--ink-2); font-size: 13.5px; }

    /* Bet Map Cards */
    .bet-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 16px;
      background: var(--surface);
    }
    .bet-title { font-size: 15.5px; font-weight: 700; margin-bottom: 6px; }
    .bet-desc { font-size: 12.8px; color: var(--muted); margin-bottom: 14px; }
    .bet-cols {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .bet-col {
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 12px;
    }
    .bet-col-head { font-size: 12px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
    .bet-player {
      font-size: 12px;
      color: var(--ink-2);
      padding: 3px 0;
      border-top: 1px dashed var(--border);
    }
    .bet-player:first-of-type { border-top: none; }

    /* Companies Directory (76) */
    .co-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .co-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
      background: var(--surface);
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .co-card:hover { border-color: var(--muted); background: var(--surface-hover); }
    .co-card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .co-card-name { font-weight: 700; font-size: 13px; color: var(--ink); }
    .co-card-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

    .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13px; }

    @media (max-width: 860px) {
      .layout { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        position: static;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .main { padding: 18px 16px 48px; }
      .metrics-box, .bet-cols, .co-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    function matchCompany(item) {
      if (state.company === "all") return true;
      const target = state.company.toLowerCase();
      if ((item.company || "").toLowerCase().includes(target) || target.includes((item.company || "").toLowerCase())) return true;
      if (Array.isArray(item.related) && item.related.some(r => r.toLowerCase().includes(target) || target.includes(r.toLowerCase()))) return true;
      return `${item.headline || item.title || ""} ${item.summary || ""}`.toLowerCase().includes(target.split(" ")[0]);
    }

    function matchQuery(text) {
      if (!state.q.trim()) return true;
      return text.toLowerCase().includes(state.q.trim().toLowerCase());
    }

        if (state.openIds.has(id)) state.openIds.delete(id);
        else state.openIds.add(id);
        row.classList.toggle("open");
        return;
      }
      const coCard = e.target.closest(".co-card[data-pick-co]");
      if (coCard) {
        const name = coCard.getAttribute("data-pick-co");
        state.company = name;
        document.getElementById("companyFilter").value = name;
        state.view = "feed";
        render();
      }
    });

    document.getElementById("themeToggle").addEventListener("click", () => {
      const isDark = document.documentElement.classList.toggle("dark");
      document.getElementById("themeToggle").textContent = isDark ? "浅色模式" : "深色模式";
      try { localStorage.setItem("fo_theme", isDark ? "dark" : "light"); } catch (e) {}
    });

    document.getElementById("archiveSelect").addEventListener("change", (e) => {
      const url = e.target.value;
      if (!url) return;
      if (window.location.protocol === "http:" || window.location.protocol === "https:") {
        window.location.href = url;
      } else {
        window.open(url, "_blank", "noopener,noreferrer");
        e.target.selectedIndex = 0;
      }
    });

    try {
      if (localStorage.getItem("fo_theme") === "dark") {
        document.documentElement.classList.add("dark");
        document.getElementById("themeToggle").textContent = "浅色模式";
      }
    } catch (e) {}

    initSidebarMeta();
    render();
  </script>
</body>
</html>
